name: Django CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: 3.12
    - name: List files
      run: |
        ls -R
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend-skf/requirements.txt
    - name: Run Tests
      run: |
        python backend-skf/manage.py test
    - name: Build Docker image
      run: |
        docker build -f backend-skf/Dockerfile -t ahma25/skf-management:latest .

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Push Docker image
      run: |
        docker push ahma25/skf-management:latest
    - name: Deployer via API Render
      run: |
        curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
          -H "Accept: application/json" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -d '{}'
